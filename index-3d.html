<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>悬崖急刹 3D · 车右后方视角</title>
<link rel="stylesheet" href="hud.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span><b>悬崖急刹</b><span class="sub">3D · 车右后方视角</span></div>
    <div class="track" id="track">
      <div class="track-fill" id="trackFill"></div>
      <div class="track-danger" id="trackDanger"></div>
      <div class="track-car" id="trackCar">🚗</div>
      <div class="track-cliff">⛰</div>
    </div>
    <div class="hud">
      <div class="hud-item"><span>距崖边</span><b id="distText">--</b></div>
      <div class="hud-item"><span>最佳成绩</span><b id="bestText">--</b></div>
    </div>
    <a class="icon-btn" href="index.html" title="切到 2D 版" style="text-decoration:none;display:flex;align-items:center;justify-content:center">2D</a>
    <button class="icon-btn" id="soundBtn" title="音效开关">🔊</button>
  </header>

  <main class="stage" id="stage">
    <canvas id="world"></canvas>

    <aside class="pedal glass" id="pedalPanel">
      <h4>刹车踏板力度</h4>
      <div class="pedal-cap">1612 N 断裂</div>
      <div class="pedal-body">
        <div class="gauge-track">
          <div class="gauge-zone"></div>
          <div class="gauge-fill" id="pedalFill"></div>
          <div id="tickWrap"></div>
        </div>
        <div class="gauge-ticks" id="gaugeTicks"></div>
      </div>
      <div class="pedal-num" id="pedalVal">0<small>N</small></div>
      <div class="pedal-sub" id="pedalSub">上限 1612 N<br>还能撑 3.43 s</div>
      <div class="crack"></div>
    </aside>

    <div class="pill calm" id="status">准备就绪</div>

    <div class="overlay" id="overlay">
      <div class="ov glass" id="ovPanel"></div>
    </div>
  </main>

  <footer class="dash">
    <div class="speedo">
      <svg viewBox="0 0 206 118" id="speedoSvg">
        <defs>
          <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#4cc9f0"/><stop offset="65%" stop-color="#ffd166"/><stop offset="100%" stop-color="#ff5d5d"/>
          </linearGradient>
        </defs>
        <path id="speedArc" d="" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10" stroke-linecap="round"/>
        <path id="speedArcFill" d="" fill="none" stroke="url(#arcGrad)" stroke-width="10" stroke-linecap="round"/>
        <g id="speedTicks"></g>
        <g id="needleG" transform="translate(103,92)">
          <line id="needle" x1="0" y1="0" x2="60" y2="0" stroke="#ff5d5d" stroke-width="3" stroke-linecap="round"/>
          <circle r="7" fill="#1a2334" stroke="rgba(255,255,255,.25)" stroke-width="1.5"/>
          <circle r="2.6" fill="#ff5d5d"/>
        </g>
      </svg>
      <div class="sp-num"><b id="speedText">0</b><small>KM / H</small></div>
    </div>

    <div class="ctrl">
      <button class="brake locked" id="brakeBtn">按住刹车<small>SPACE / 按住鼠标</small></button>
    </div>

    <div class="meters glass" id="meters">
      <div>现在点刹还需 <b id="needText">--</b> ｜ 贴边极限 <b id="theoDist">--</b></div>
      <div>累计踩下 <b id="heldText">0.00 s</b> ／ 力度表还能撑 <b id="leftText">3.43 s</b></div>
      <div id="predictText">— 别急着踩，也别踩太晚 —</div>
    </div>
  </footer>
</div>

<div class="sr" id="selftest" aria-hidden="true"></div>

<script src="game.js"></script>
<script src="view3d.js"></script>
</body>
</html>
