<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>悬崖急刹 · 刹车踏板挑战 （单文件版）</title>
<style>
/* 悬崖急刹 —— HUD 样式（站点入口 index.html 与归档页 archive/2d.html 共用） */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#04070d;color:#e9eff8;
    font-family:"Segoe UI Variable Display","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  button{font-family:inherit}
  .app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
    background:radial-gradient(1100px 560px at 50% -8%,#182742 0%,#080e1b 58%,#03060c 100%)}

  /* ---------- 顶栏 ---------- */
  .topbar{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid rgba(255,255,255,.06);
    backdrop-filter:blur(10px);background:rgba(8,14,26,.55)}
  .brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
  .brand b{font-size:17px;letter-spacing:.5px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:#ffb457;box-shadow:0 0 12px #ffb45790;align-self:center}
  .brand .sub{font-size:12px;color:#8b9ab3}
  .track{position:relative;flex:1;height:26px;border-radius:13px;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.07);overflow:hidden;min-width:180px}
  .track-danger{position:absolute;right:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(255,72,72,0),rgba(255,72,72,.42));
    border-left:1px dashed rgba(255,120,120,.6)}
  .track-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#3fa9ff55,#4cc9f055)}
  .track-car{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);font-size:15px;filter:drop-shadow(0 0 4px #000)}
  .track-cliff{position:absolute;right:2px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.9}
  .hud{display:flex;gap:16px;white-space:nowrap}
  .hud-item{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
  .hud-item span{font-size:10px;color:#8092ab;letter-spacing:1px}
  .hud-item b{font-size:16px;font-variant-numeric:tabular-nums}
  .icon-btn{width:32px;height:32px;border-radius:10px;border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.05);color:#cfe0f5;cursor:pointer;font-size:15px;line-height:1}
  .icon-btn:hover{background:rgba(255,255,255,.1)}

  /* ---------- 舞台 ---------- */
  .stage{position:relative;min-height:0;overflow:hidden}
  #world{display:block;width:100%;height:100%}
  .glass{background:rgba(13,20,34,.62);border:1px solid rgba(255,255,255,.09);
    border-radius:16px;backdrop-filter:blur(14px);box-shadow:0 10px 36px rgba(0,0,0,.45)}

  .pill{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:7px 16px;border-radius:999px;
    font-size:13.5px;font-weight:600;letter-spacing:.3px;white-space:nowrap;
    background:rgba(13,20,34,.7);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px);
    transition:color .2s,border-color .2s,background .2s}
  .pill.calm{color:#9fb3ca}
  .pill.go{color:#5ee0a0;border-color:#5ee0a055;background:rgba(20,60,45,.6)}
  .pill.brake{color:#ffcf6b;border-color:#ffcf6b55;background:rgba(70,50,15,.6)}
  .pill.bad{color:#ff7a7a;border-color:#ff7a7a66;background:rgba(70,20,20,.65)}

  /* 左侧踏板力度表 */
  .pedal{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:112px;padding:12px 10px 12px;
    display:flex;flex-direction:column;align-items:center;gap:8px}
  .pedal h4{margin:0;font-size:11px;font-weight:600;color:#93a6bf;letter-spacing:1.2px}
  .pedal-cap{font-size:9.5px;color:#ff9a7a;letter-spacing:.4px;margin-top:-4px}
  .pedal-body{position:relative;width:100%;display:flex;gap:8px;justify-content:center}
  .gauge-track{position:relative;width:26px;height:190px;border-radius:13px;overflow:hidden;
    background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.12)}
  .gauge-fill{position:absolute;left:0;right:0;bottom:0;height:0%;
    background:linear-gradient(0deg,#3ddc97,#ffd166 62%,#ff5d5d 92%);transition:height .06s linear}
  .gauge-break{position:absolute;left:-4px;right:-4px;height:0;border-top:2px dashed #ff5d5d;bottom:100%;opacity:.85}
  .gauge-zone{position:absolute;left:0;right:0;top:0;height:22%;background:repeating-linear-gradient(45deg,rgba(255,60,60,.28) 0 5px,transparent 5px 10px)}
  .gauge-ticks{position:absolute;right:-32px;top:0;bottom:0;width:30px;font-size:9px;color:#7c8ea6}
  .gauge-ticks i{position:absolute;right:0;font-style:normal;transform:translateY(50%)}
  .gauge-ticks i::before{content:"";position:absolute;left:-8px;top:50%;width:6px;height:1px;background:rgba(255,255,255,.35)}
  .pedal-num{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .pedal-num small{font-size:10px;font-weight:500;color:#8fa2ba;margin-left:2px}
  .pedal-sub{font-size:10.5px;color:#8fa2ba;text-align:center;line-height:1.45;font-variant-numeric:tabular-nums}
  .pedal.broken{border-color:#ff5d5d77;box-shadow:0 0 0 1px #ff5d5d33,0 10px 36px rgba(120,0,0,.5)}
  .pedal.broken .gauge-fill{background:#ff4d4d}
  .pedal.danger{border-color:#ff9a5e88;box-shadow:0 0 0 1px #ff9a5e44,0 0 22px rgba(255,120,60,.25) inset}
  .pedal.danger .pedal-num{color:#ffb457}
  .crack{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
    background:
      linear-gradient(72deg,transparent 48%,#ffd9d9 49%,transparent 50%) 12% 30%/60% 70% no-repeat,
      linear-gradient(-58deg,transparent 48%,#ffb9b9 49%,transparent 50%) 70% 20%/70% 60% no-repeat}
  .pedal.broken .crack{opacity:.75}

  /* 中央浮层 */
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(600px 400px at 50% 45%,rgba(4,8,16,.55),rgba(2,4,9,.85));
    backdrop-filter:blur(3px);z-index:5;transition:opacity .25s}
  .overlay.hide{opacity:0;pointer-events:none}
  .ov{width:min(520px,88%);padding:26px 26px 22px;text-align:center}
  .ov h1{margin:0 0 6px;font-size:27px;letter-spacing:.5px}
  .ov h2{margin:0 0 4px;font-size:24px}
  .ov .lead{margin:0 0 14px;font-size:13px;color:#93a6bf;line-height:1.7}
  .ov ul{margin:0 0 16px;padding:0 0 0 2px;list-style:none;text-align:left;font-size:12.8px;color:#b7c6da;line-height:1.95}
  .ov ul li::before{content:"›";color:#ffb457;margin-right:8px;font-weight:700}
  .kbd{display:inline-block;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.16);font-size:11.5px}
  .btn{cursor:pointer;border:none;border-radius:14px;padding:13px 22px;font-size:15.5px;font-weight:700;
    letter-spacing:.6px;color:#08121f;background:linear-gradient(180deg,#ffd479,#ffab3d);
    box-shadow:0 8px 24px rgba(255,150,40,.28);transition:transform .12s,box-shadow .12s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(255,150,40,.4)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:rgba(255,255,255,.08);color:#dbe7f6;box-shadow:none;border:1px solid rgba(255,255,255,.14)}
  .res-score{font-size:44px;font-weight:800;line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
  .res-meta{font-size:12.5px;color:#93a6bf;line-height:1.8;margin-bottom:14px}
  .res-rank{display:inline-block;min-width:34px;padding:3px 10px;border-radius:9px;font-weight:800;font-size:15px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
  .row{display:flex;gap:10px;justify-content:center}

  /* ---------- 底部仪表台 ---------- */
  .dash{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:6px 20px 14px;
    border-top:1px solid rgba(255,255,255,.06);background:linear-gradient(180deg,rgba(6,10,18,.2),rgba(4,7,13,.9))}
  .speedo{position:relative;width:206px;height:118px}
  .speedo svg{position:absolute;inset:0;overflow:visible}
  .sp-num{position:absolute;left:0;right:0;bottom:2px;text-align:center;line-height:1}
  .sp-num b{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .sp-num small{display:block;font-size:10.5px;color:#8092ab;letter-spacing:2px;margin-top:2px}
  .ctrl{display:flex;flex-direction:column;align-items:center;gap:8px}
  .brake{cursor:pointer;user-select:none;touch-action:none;border:none;border-radius:20px;
    min-width:300px;padding:20px 34px;font-size:19px;font-weight:800;letter-spacing:2px;
    color:#2a0d0d;background:linear-gradient(180deg,#ff9b8a,#f2543f);
    box-shadow:0 10px 30px rgba(220,60,40,.32),inset 0 -3px 0 rgba(0,0,0,.18);
    transition:transform .1s,box-shadow .1s,filter .2s;display:flex;flex-direction:column;gap:3px;align-items:center}
  .brake small{font-size:10.5px;font-weight:600;letter-spacing:1.5px;opacity:.72}
  .brake:active,.brake.on{transform:translateY(2px) scale(.995);
    box-shadow:0 4px 14px rgba(220,60,40,.4),inset 0 3px 8px rgba(0,0,0,.25);filter:brightness(1.08)}
  .brake[disabled]{cursor:not-allowed;filter:grayscale(.85) brightness(.62);box-shadow:none;transform:none}
  .brake.locked{background:linear-gradient(180deg,#8c96a6,#5e6a7c);color:#eaf0f8}
  .meters{min-width:250px;padding:11px 14px;border-radius:14px;font-size:12px;color:#a9bad0;line-height:1.7}
  .meters b{color:#e9eff8;font-variant-numeric:tabular-nums}
  .meters .warn{color:#ff8b6b;font-weight:700}
  .meters .ok{color:#5ee0a0;font-weight:700}
  .flash{animation:pulse .5s ease 2}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .sr{position:absolute;left:-9999px}

  /* ---------- 窄屏兜底 ---------- */
  @media (max-width: 920px){
    .topbar{gap:10px;padding:8px 10px}
    .brand .sub{display:none}
    .hud{display:none}
    .dash{grid-template-columns:auto 1fr;gap:10px;padding:4px 12px 10px}
    #meters{display:none}
    .speedo{width:148px;height:86px}
    .sp-num b{font-size:26px}
    .brake{min-width:0;width:100%;padding:16px 12px;font-size:16px;letter-spacing:1px}
    .pedal{left:8px;width:78px;padding:8px 6px;gap:5px}
    .pedal h4{font-size:9.5px;letter-spacing:.5px}
    .pedal-cap{font-size:8px}
    .gauge-track{width:20px;height:132px}
    .gauge-ticks{right:-26px;width:24px;font-size:8px}
    .pedal-num{font-size:15px}
    .pedal-sub{font-size:9px}
    .ov{padding:18px 16px 16px}
    .ov h1{font-size:22px}
    .ov ul{font-size:11.6px;line-height:1.8}
  }

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span><b>悬崖急刹</b><span class="sub">第三人称车后视角</span></div>
    <div class="track" id="track">
      <div class="track-fill" id="trackFill"></div>
      <div class="track-danger" id="trackDanger"></div>
      <div class="track-car" id="trackCar">🚗</div>
      <div class="track-cliff">⛰</div>
    </div>
    <div class="hud">
      <div class="hud-item"><span>距崖边</span><b id="distText">--</b></div>
      <div class="hud-item"><span>最佳成绩</span><b id="bestText">--</b></div>
    </div>
    <button class="icon-btn" id="soundBtn" title="音效开关">🔊</button>
  </header>

  <main class="stage" id="stage">
    <canvas id="world"></canvas>

    <aside class="pedal glass" id="pedalPanel">
      <h4>刹车踏板力度</h4>
      <div class="pedal-cap">1612 N 断裂</div>
      <div class="pedal-body">
        <div class="gauge-track">
          <div class="gauge-zone"></div>
          <div class="gauge-fill" id="pedalFill"></div>
          <div id="tickWrap"></div>
        </div>
        <div class="gauge-ticks" id="gaugeTicks"></div>
      </div>
      <div class="pedal-num" id="pedalVal">0<small>N</small></div>
      <div class="pedal-sub" id="pedalSub">上限 1612 N<br>还能撑 2.86 s</div>
      <div class="crack"></div>
    </aside>

    <div class="pill calm" id="status">准备就绪</div>

    <div class="overlay" id="overlay">
      <div class="ov glass" id="ovPanel"></div>
    </div>
  </main>

  <footer class="dash">
    <div class="speedo">
      <svg viewBox="0 0 206 118" id="speedoSvg">
        <defs>
          <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#4cc9f0"/><stop offset="65%" stop-color="#ffd166"/><stop offset="100%" stop-color="#ff5d5d"/>
          </linearGradient>
        </defs>
        <path id="speedArc" d="" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10" stroke-linecap="round"/>
        <path id="speedArcFill" d="" fill="none" stroke="url(#arcGrad)" stroke-width="10" stroke-linecap="round"/>
        <g id="speedTicks"></g>
        <g id="needleG" transform="translate(103,92)">
          <line id="needle" x1="0" y1="0" x2="60" y2="0" stroke="#ff5d5d" stroke-width="3" stroke-linecap="round"/>
          <circle r="7" fill="#1a2334" stroke="rgba(255,255,255,.25)" stroke-width="1.5"/>
          <circle r="2.6" fill="#ff5d5d"/>
        </g>
      </svg>
      <div class="sp-num"><b id="speedText">0</b><small>KM / H</small></div>
    </div>

    <div class="ctrl">
      <button class="brake locked" id="brakeBtn">按住刹车<small>SPACE / 按住鼠标</small></button>
    </div>

    <div class="meters glass" id="meters">
      <div>现在点刹还需 <b id="needText">--</b> ｜ 贴边极限 <b id="theoDist">--</b></div>
      <div>累计踩下 <b id="heldText">0.00 s</b> ／ 力度表还能撑 <b id="leftText">2.86 s</b></div>
      <div id="predictText">— 别急着踩，也别踩太晚 —</div>
    </div>
  </footer>
</div>

<div class="sr" id="selftest" aria-hidden="true"></div>

<script>
/*!
 * 悬崖急刹 (Cliff Brake) — 物理内核
 * 纯逻辑，无 DOM / Canvas 依赖，可被测试脚本直接驱动。
 *
 * 规则：
 *   1) 车从起点静止，以 engineA 加速，到 100km/h 后进入巡航(定速)。
 *   2) 到 100km/h 后才允许踩刹车（之前按钮锁定）。
 *   3) 刹车生效期间给车一个固定减速度 brakeDecel（9.2 m/s²，≈0.94g 真车感）。
 *   4) 踏板力度随"按住刹车的累计时间"以 forceRamp 累积；松开后以 forceDecay 回落。
 *      力度到 forceBreak(1612N) 踏板断裂：立刻判负，并播放"失控甩尾→弹射飞出→空中翻滚→
 *      落地撞毁 / 飞过崖边坠入峡谷"的动画（不再让车慢慢溜到崖边，省掉等待）。
 *   5) 车头(x) 越过 roadLen 即坠崖；在越过之前速度归零 = 成功刹停。
 *
 * 数值设计的核心（决定了游戏是否"真的能玩"）：
 *   · 从 100km/h 刹停需要按住 3.02 s（v0/brakeDecel = 27.78/9.2）。
 *   · 力度表上限 1612N ÷ 564N/s = 2.86 s —— 比 3.02 s 短！
 *   => 一脚踩到底必然在刹停前 0.16 秒断裂、车随即冲下悬崖。
 *   => 唯一活路是"点刹"：踩 ~0.6s / 松 ~0.3s，让力度表反复回落，
 *      累计踩够 3.02 s 才能停下。松手期间车不减速，所以要提前开始点刹。
 *   （速度从 120 改成 100 时，forceRamp/forceDecay 按 564/204 同比例缩放，
 *     保证"一脚不松必断"这条前提仍然成立；roadLen 按 v² 缩放，反应窗口手感不变。）
 *   注意：若把减速度改成"正比于累积力度"，则刹停与断裂会在数学上互斥
 *   （让力度涨到 1612N 所需的最小冲量恒大于把车从 100 刹停所需冲量），
 *   所以减速度必须取固定值。
 */
(function (global) {
  'use strict';

  var CFG = {
    carStartX: 8,        // m，车头初始位置
    carLen: 4.6,         // m，车长(仅用于绘图/悬空判定)
    roadLenMin: 200,     // m，悬崖位置随机区间
    roadLenMax: 245,
    kmhCruise: 100,      // 巡航速度（也是解锁刹车的门槛）
    engineMin: 4.5,      // m/s^2，本局发动机加速度随机区间
    engineMax: 6.0,
    brakeDecel: 9.2,     // m/s^2，刹车减速度(固定)
    forceRamp: 564,      // N/s，按住时踏板力度累积速率
    forceDecay: 204,     // N/s，松开时力度回落速率
    forceBreak: 1612,    // N，踏板断裂阈值
    stopEps: 0.12,       // m/s，判定"已停稳"
    fallGravity: 20,     // m/s^2，坠崖动画重力
    fallingMaxT: 1.9     // s，坠崖动画时长（够走出画面即可，别拖时间）
  };

  var RATINGS = [
    { min: 97, key: 'S', name: '神之刹停', tip: '车头几乎悬在崖边，一脚定乾坤' },
    { min: 90, key: 'A', name: '贴边急刹', tip: '险到骨子里' },
    { min: 75, key: 'B', name: '干脆利落', tip: '稳、准、狠' },
    { min: 40, key: 'C', name: '安全稳妥', tip: '停住了，但还能再冒险一点' },
    { min: 0, key: 'D', name: '过于保守', tip: '刹太早，白瞎了这一段路' }
  ];

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  /** 理论值（解析解），供 UI 提示与测试使用 */
  function theoretical(cfg) {
    var c = Object.assign({}, CFG, cfg || {});
    var v0 = c.kmhCruise / 3.6;
    var holdToStop = v0 / c.brakeDecel;             // 刹停需要按住的总时间
    var brakeDist = v0 * v0 / (2 * c.brakeDecel);   // 一脚不松的刹停距离(理想)
    var rampToBreak = c.forceBreak / c.forceRamp;   // 一脚不松多久断裂
    var maxHold = Math.min(rampToBreak, holdToStop);
    return {
      holdToStop: holdToStop,       // 3.62 s
      brakeDist: brakeDist,         // 60.4 m
      rampToBreak: rampToBreak,     // 3.43 s —— 小于 holdToStop 才有戏
      maxHold: maxHold,
      mustFeather: rampToBreak < holdToStop,
      shortfall: holdToStop - rampToBreak,                       // 需要靠松手补回的时间
      minRelease: (c.forceRamp * holdToStop - c.forceBreak) / c.forceDecay  // 最少累计松手时间
    };
  }

  function CarGame(cfg) {
    this.cfg = Object.assign({}, CFG, cfg || {});
    this.reset();
  }

  CarGame.prototype.reset = function (opt) {
    opt = opt || {};
    var c = this.cfg;
    this.vCruise = opt.vCruise != null ? opt.vCruise : c.kmhCruise / 3.6;
    this.roadLen = opt.roadLen != null ? opt.roadLen : rand(c.roadLenMin, c.roadLenMax);
    this.engineA = opt.engineA != null ? opt.engineA : rand(c.engineMin, c.engineMax);

    this.x = opt.carStartX != null ? opt.carStartX : c.carStartX; // 车头位置(m)
    this.v = 0;              // m/s
    this.t = 0;              // s，本局已运行时间
    this.F = 0;              // N，踏板力度表读数
    this.heldT = 0;          // s，累计按住刹车时间
    this.brakeInput = false; // 玩家当前是否按着按钮
    this.brakeOn = false;    // 本帧刹车是否实际生效
    this.pedalBroken = false;
    this.brokeAtT = null;
    this.brokeAtV = null;
    this.phase = 'idle';     // idle | accel | run | wreck | falling | won | lost
    this.yOff = 0;           // m，离地高度(坠落/腾空)
    this.fallVy = 0;
    this.fallRot = 0;
    this.fallVr = 0;
    this.fallT = 0;
    this.wreckT = 0;         // 失控动画计时
    this.wreckDir = 1;       // 甩尾方向
    this.airborne = false;
    this.impact = false;     // 是否撞地收场(区别于坠入峡谷)
    this.rot = 0;            // 车身翻滚角(2D 视图用)
    this.rotYaw = 0;         // 偏航(地面甩尾, 3D 视图用)
    this.rotPitch = 0;       // 俯仰(空中翻滚, 3D 视图用)
    this.rotLaunch = 0;      // 起飞瞬间已累计的转角
    this.launchX = 0;        // 失控滑行速度(动画用)
    this.shake = 0;
    this.stopMargin = null;  // m，停稳后车头距崖边距离
    this.score = null;
    this.rating = null;
    this.cruiseX = null;     // 达到 100km/h 时的位置
    this.events = [];
    return this;
  };

  CarGame.prototype.pushEvent = function (type) {
    this.events.push({ t: Math.round(this.t * 1000) / 1000, type: type, x: this.x, v: this.v, F: this.F });
    if (this.events.length > 64) this.events.shift();
  };

  CarGame.prototype.start = function () {
    if (this.phase === 'idle' || this.phase === 'won' || this.phase === 'lost') {
      if (this.phase !== 'idle') this.reset();
      this.phase = 'accel';
      this.pushEvent('start');
    }
    return this;
  };

  CarGame.prototype.setBrake = function (on) {
    this.brakeInput = !!on;
    return this;
  };

  CarGame.prototype.tick = function (dt) {
    var c = this.cfg;
    if (!(dt > 0)) return this;
    dt = Math.min(dt, 0.05);
    if (this.phase === 'idle' || this.phase === 'won' || this.phase === 'lost') {
      if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 1.5);
      return this;
    }
    this.t += dt;

    if (this.phase === 'accel') {
      this.v += this.engineA * dt;
      if (this.v >= this.vCruise) {
        this.v = this.vCruise;
        this.phase = 'run';
        this.cruiseX = this.x;
        this.pushEvent('cruise');
      }
    } else if (this.phase === 'run') {
      this.brakeOn = !!(this.brakeInput && !this.pedalBroken);
      if (this.brakeOn) {
        this.heldT += dt;
        this.F = Math.min(c.forceBreak, this.F + c.forceRamp * dt);
        this.v = Math.max(0, this.v - c.brakeDecel * dt);
        if (this.F >= c.forceBreak) {           // 踏板断裂 -> 立即失控
          this.pedalBroken = true;
          this.brokeAtT = this.t;
          this.brokeAtV = this.v;
          this.pushEvent('break');
          this.startWreck();
        }
      } else if (!this.pedalBroken && this.F > 0) {
        // 松开踏板：力度回落（断裂后仪表冻结）
        this.F = Math.max(0, this.F - c.forceDecay * dt);
      }
    } else if (this.phase === 'wreck') {
      this.wreckT += dt;
      var w = this.wreckT;
      if (!this.airborne) {
        // 一、抱死甩尾（还在地面）
        this.rot += this.wreckDir * 2.4 * dt;
        this.rotYaw = this.rot;
        this.x += this.launchX * Math.max(0, 1 - w / 1.2) * dt;
        if (w >= 0.45) {
          this.airborne = true;
          this.vy = 14 + Math.min(this.v * 0.15, 3);   // 弹射初速(约飞起 5 m 高)
          this.rotV = this.wreckDir * 5.4;
          this.rotLaunch = this.rot;
          this.pushEvent('air');
        }
      } else {
        // 二、弹射飞出 + 空中翻滚
        this.vy -= c.fallGravity * dt;
        this.yOff += this.vy * dt;
        this.rot += this.rotV * dt;
        this.rotPitch = this.rot - this.rotLaunch;
        this.x += Math.max(this.launchX, 12) * dt;
        if (this.shake < 0.45) this.shake = 0.45;
        if (this.yOff <= 0 && w > 0.62) {
          if (this.x >= this.roadLen) {
            // 飞过了崖边 -> 直接坠入峡谷
            this.phase = 'falling';
            this.v = Math.max(this.launchX, 12);
            this.fallVy = Math.max(1.5, -this.vy);
            this.fallVr = this.rotV;
            this.fallRot = this.rot;
            this.fallT = 0;
            this.yOff = 0;
            this.pushEvent('fall');
          } else {
            // 三、砸回地面 -> 撞毁收场
            this.yOff = 0;
            this.impact = true;
            this.shake = 1.2;
            this.lose();
          }
        }
      }
    }

    if (this.phase === 'accel' || this.phase === 'run') {
      this.x += this.v * dt;
    } else if (this.phase === 'falling') {
      this.fallT += dt;
      this.fallVy += c.fallGravity * dt;
      this.yOff += this.fallVy * dt;
      this.x += this.v * dt;
      this.fallRot += this.fallVr * dt;
      if (this.fallT >= c.fallingMaxT) {
        this.phase = 'lost';
        this.pushEvent('lost');
      }
    }

    if (this.phase === 'accel' || this.phase === 'run') {
      if (this.x >= this.roadLen) {
        this.startFall();
      } else if (this.phase === 'run' && this.v <= c.stopEps) {
        this.win();
      }
    }
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 1.5);
    return this;
  };

  CarGame.prototype.startWreck = function () {
    this.phase = 'wreck';
    this.wreckT = 0;
    this.wreckDir = Math.random() < 0.5 ? -1 : 1;
    this.airborne = false;
    this.impact = false;
    this.yOff = 0;
    this.vy = 0;
    this.rot = 0;
    this.rotYaw = 0;
    this.rotPitch = 0;
    this.rotLaunch = 0;
    this.rotV = 0;
    this.launchX = Math.max(this.v, 6);   // 动画用滑行速度(即使车已很慢也要有戏)
    this.shake = 1;
    this.pushEvent('wreck');
    return this;
  };

  CarGame.prototype.startFall = function () {
    this.phase = 'falling';
    this.fallVy = 2.5;
    this.fallVr = -(1.7 + Math.min(this.v * 0.06, 1.8));
    this.fallT = 0;
    this.yOff = 0;
    this.shake = 1;
    this.pushEvent('fall');
  };

  CarGame.prototype.win = function () {
    this.v = 0;
    this.phase = 'won';
    this.stopMargin = this.roadLen - this.x;
    this.score = clamp(Math.round(100 - this.stopMargin), 0, 100);
    this.rating = ratingFor(this.score);
    this.pushEvent('win');
  };

  CarGame.prototype.lose = function () {
    this.phase = 'lost';
    this.stopMargin = null;
    this.score = 0;
    this.rating = null;
    this.pushEvent('lost');
  };

  /** 落点预测：假设继续踩住（固定减速度，所以是解析准确的） */
  CarGame.prototype.predict = function () {
    var c = this.cfg;
    var v = this.v;
    var dist = v * v / (2 * c.brakeDecel);
    var tau = v / c.brakeDecel;                 // 剩余刹车时间
    var needN = this.F + c.forceRamp * tau;     // 刹停时力度表读数
    return {
      tau: tau,
      dist: dist,
      stopX: this.x + dist,
      needN: needN,
      willBreak: needN > c.forceBreak,
      overCliff: this.x + dist > this.roadLen
    };
  };

  CarGame.prototype.snapshot = function () {
    return {
      phase: this.phase, t: this.t, x: this.x, v: this.v, kmh: this.kmh(),
      F: this.F, pedalBroken: this.pedalBroken, heldT: this.heldT,
      stopMargin: this.stopMargin, score: this.score,
      rating: this.rating ? this.rating.key : null,
      roadLen: this.roadLen, engineA: this.engineA
    };
  };

  /** 剩余可按住时间(s)，到 0 即断裂 */
  CarGame.prototype.holdLeft = function () { return Math.max(0, (this.cfg.forceBreak - this.F) / this.cfg.forceRamp); };
  CarGame.prototype.kmh = function () { return this.v * 3.6; };
  CarGame.prototype.pedalPct = function () { return this.F / this.cfg.forceBreak; };
  CarGame.prototype.distToCliff = function () { return Math.max(0, this.roadLen - this.x); };
  CarGame.prototype.isTerminal = function () { return this.phase === 'won' || this.phase === 'lost'; };

  function ratingFor(score) {
    for (var i = 0; i < RATINGS.length; i++) if (score >= RATINGS[i].min) return RATINGS[i];
    return RATINGS[RATINGS.length - 1];
  }

  global.CarGame = CarGame;
  global.CAR_CFG = CFG;
  global.CAR_RATINGS = RATINGS;
  global.carRating = ratingFor;
  global.carTheoretical = theoretical;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/*!
 * 悬崖急刹 3D —— 手写软件三维渲染器（零依赖，不联网也能跑）
 *
 * · 相机：车「右后方」第三人称追尾视角（位置 = 车后 8.5m、右侧 3.8m、高 3.4m）
 * · 物理内核沿用 game.js，一行未改（17 项物理断言继续有效）
 * · 渲染：世界多边形 -> 相机空间 -> 近平面裁剪 -> 透视投影 -> 分层 + 深度排序
 *         填充（画家算法），带方向光平面着色 + 距离雾。没有任何 WebGL/three.js。
 */
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };

  var canvas = $('#world');
  var ctx = canvas.getContext('2d');
  var stage = $('#stage');

  var el = {
    distText: $('#distText'), bestText: $('#bestText'),
    trackFill: $('#trackFill'), trackCar: $('#trackCar'), trackDanger: $('#trackDanger'),
    pedalFill: $('#pedalFill'), pedalVal: $('#pedalVal'), pedalSub: $('#pedalSub'),
    pedalPanel: $('#pedalPanel'), gaugeTicks: $('#gaugeTicks'), needText: $('#needText'),
    speedText: $('#speedText'), needle: $('#needle'), speedArcFill: $('#speedArcFill'),
    speedArc: $('#speedArc'), speedTicks: $('#speedTicks'),
    brakeBtn: $('#brakeBtn'), status: $('#status'),
    overlay: $('#overlay'), ovPanel: $('#ovPanel'),
    meters: $('#meters'), predictText: $('#predictText'),
    heldText: $('#heldText'), leftText: $('#leftText'), theoDist: $('#theoDist'),
    soundBtn: $('#soundBtn'), selftest: $('#selftest')
  };

  var THEO = window.carTheoretical();
  var FEATHER = 1.45;
  var DANGER = THEO.brakeDist * 1.5;
  var g = new window.CarGame();

  // ================================================================ 3D 数学
  var W = 0, H = 0, DPR = 1, focal = 600;
  var NEAR = 0.35;
  var camPos = [0, 4, 8], camFwd = [1, 0, 0], camRight = [0, 0, 1], camUp = [0, 1, 0];
  var camWant = [0, 4, 8], camLook = [0, 1, 0];
  var LIGHT = [0, 0, 0];
  var FOG = [170, 142, 126], FOG_A = 55, FOG_B = 420;   // 距离雾（暖调，和天际线一致）
  var shakeX = 0, shakeY = 0;

  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function cross(a, b) {
    return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  }
  function norm(v) { var l = Math.sqrt(dot(v, v)) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }
  function lerp(a, b, t) { return a + (b - a) * t; }

  function lookAt(pos, target) {
    camPos = pos;
    camFwd = norm(sub(target, pos));
    camRight = norm(cross(camFwd, [0, 1, 0]));
    camUp = cross(camRight, camFwd);
  }
  function toCam(p) {
    var d = sub(p, camPos);
    return [dot(d, camRight), dot(d, camUp), dot(d, camFwd)];
  }
  function sx2(c) { return W * 0.5 + c[0] / c[2] * focal; }
  function sy2(c) { return H * 0.5 - c[1] / c[2] * focal; }

  // ================================================================ 图元收集
  var items = [];
  var LAYER = { CANYON: 1, CLIFF: 2, MESA: 3, ROAD: 4, MARK: 5, PROP: 6, CAR: 7, SMOKE: 8, TAG: 9 };

  // 柔边烟团贴图（离屏生成一次）
  var SMOKE_SPR = (function () {
    var c = document.createElement('canvas');
    c.width = c.height = 64;
    var x = c.getContext('2d');
    var gd = x.createRadialGradient(32, 32, 1, 32, 32, 32);
    gd.addColorStop(0, 'rgba(238,240,246,0.95)');
    gd.addColorStop(0.45, 'rgba(226,230,238,0.55)');
    gd.addColorStop(1, 'rgba(214,220,232,0)');
    x.fillStyle = gd;
    x.fillRect(0, 0, 64, 64);

  })();

  /** 世界多边形 */
  function poly(pts, col, layer, opt) {
    opt = opt || {};
    var n = norm(cross(sub(pts[1], pts[0]), sub(pts[2], pts[1])));
    var br = 0.62 + 0.38 * Math.max(0, dot(n, LIGHT));
    var cs = [];
    for (var i = 0; i < pts.length; i++) cs.push(toCam(pts[i]));
    items.push({
      t: 0, c: cs, L: layer,
      col: [col[0] * br, col[1] * br, col[2] * br],
      a: opt.a == null ? 1 : opt.a, fog: opt.fog !== false, line: opt.line
    });
  }
  function quad(a, b, c, d, col, layer, opt) { poly([a, b, c, d], col, layer, opt); }

  /** 立方体（外法线朝外的绕序） */
  function box(x0, x1, y0, y1, z0, z1, col, layer, opt) {
    quad([x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1], col, layer, opt); // +X
    quad([x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0], col, layer, opt); // -X
    quad([x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0], col, layer, opt); // +Y
    quad([x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1], col, layer, opt); // -Y
    quad([x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1], col, layer, opt); // +Z
    quad([x0, y0, z0], [x0, y1, z0], [x1, y1, z0], [x1, y0, z0], col, layer, opt); // -Z
  }
  /** 4 点面（任意绕序，用于自定义形状） */
  function face(a, b, c, d, col, layer, opt) { quad(a, b, c, d, col, layer, opt); }

  function puff(p, r, col, alpha) {
    items.push({ t: 1, p: toCam(p), r: r, L: LAYER.SMOKE, col: col, a: alpha, fog: true });
  }
  function label(p, str, col, size, dy) {
    items.push({ t: 2, p: toCam(p), s: str, col: col, size: size || 1.2, dy: dy || 0, L: LAYER.TAG });
  }
  function stripe(a, b, col, w, layer, opt) {  // 细长条(用线段画, 避免退化)
    items.push({ t: 3, c: [toCam(a), toCam(b)], w: w, col: col, L: layer, a: (opt && opt.a) == null ? 1 : opt.a, fog: !(opt && opt.noFog) });
  }

  // ================================================================ 场景构建
  function carPose() {
    var y = 0, yaw = 0, pitch = 0, roll = 0;
    if (g.phase === 'wreck') {
      if (!g.airborne) { yaw = g.rotYaw; }
      else { y = g.yOff; yaw = g.rotYaw; pitch = g.rotPitch; roll = 0.22 * (g.wreckDir || 1); }
    } else if (g.phase === 'falling') {
      y = g.yOff; pitch = g.fallRot; roll = 0.12;
    }
    return { x: g.x, y: y, z: 0, yaw: yaw, pitch: pitch, roll: roll };
  }

  function buildWorld() {
    items.length = 0;
    var road = g.roadLen, pose = carPose();
    var x, i;

    // ---- 峡谷（崖外世界） ----
    quad([road - 24, -52, -520], [road + 620, -52, -520], [road + 620, -52, 520], [road - 24, -52, 520], [26, 30, 40], LAYER.CANYON);
    for (i = 0; i < 7; i++) {                       // 对面崖壁分层
      var y0 = -52 + i * 6.5, y1 = y0 + 6.5;
      quad([road + 46, y0, -520], [road + 46, y0, 520], [road + 46, y1, 520], [road + 46, y1, -520],
        i % 2 ? [40, 47, 62] : [32, 38, 52], LAYER.CANYON);
    }
    // 远山（平滑山脊，很远很淡）
    var RIDGE = 520;
    for (i = 0; i < 26; i++) {
      var z0 = -1200 + i * 96, z1 = z0 + 96, zc = (z0 + z1) / 2;
      var hh = 46 + 26 * Math.sin(i * 0.9 + 0.4) + 14 * Math.sin(i * 2.3 + 1.1);
      poly([[road + RIDGE, -60, z0], [road + RIDGE, -60, z1], [road + RIDGE + 26, hh, zc]], [96, 104, 126], LAYER.CANYON);
    }
    for (i = 0; i < 20; i++) {
      var w0 = -1200 + i * 120, w1 = w0 + 120, wc = (w0 + w1) / 2;
      var h2 = 26 + 18 * Math.sin(i * 1.3 + 2.2);
      poly([[road + RIDGE - 90, -60, w0], [road + RIDGE - 90, -60, w1], [road + RIDGE - 60, h2, wc]], [112, 118, 138], LAYER.CANYON);
    }

    // ---- 台地崖壁（roadLen 处向下） ----
    for (i = 0; i < 8; i++) {
      var cy0 = -i * 6.5, cy1 = cy0 - 6.5;
      quad([road, cy0, -30], [road, cy0, 30], [road, cy1, 30], [road, cy1, -30],
        i % 2 ? [96, 84, 66] : [80, 70, 55], LAYER.CLIFF);
    }
    // 台地左右侧面（少量，避免看穿）
    for (i = 0; i < 8; i++) {
      var sy0 = -i * 6.5, sy1 = sy0 - 6.5;
      quad([road - 2, sy0, -30], [road - 2, sy1, -30], [road + 2, sy1, -30], [road + 2, sy0, -30], [92, 80, 62], LAYER.CLIFF);
      quad([road - 2, sy0, 30], [road + 2, sy0, 30], [road + 2, sy1, 30], [road - 2, sy1, 30], [92, 80, 62], LAYER.CLIFF);
    }

    // ---- 台地顶面（土/碎石） ----
    for (x = -90; x < road; x += 14) {
      var x2 = Math.min(x + 14, road);
      quad([x, 0, -30], [x2, 0, -30], [x2, 0, 30], [x, 0, 30], [150, 132, 100], LAYER.MESA);
      quad([x, 0, -30], [x2, 0, -30], [x2, -1.6, -30], [x, -1.6, -30], [116, 101, 76], LAYER.CLIFF);
      quad([x, 0, 30], [x, -1.6, 30], [x2, -1.6, 30], [x2, 0, 30], [116, 101, 76], LAYER.CLIFF);
    }

    // ---- 柏油路 ----
    for (x = 0; x < road; x += 14) {
      var rx2 = Math.min(x + 14, road);
      quad([x, 0.02, -5.2], [rx2, 0.02, -5.2], [rx2, 0.02, 5.2], [x, 0.02, 5.2], [104, 108, 120], LAYER.ROAD);
    }
    // 路缘白线（真实宽度 0.15m）+ 中线虚线
    stripe([0, 0.05, -5.1], [road, 0.05, -5.1], [186, 190, 198], 0.15, LAYER.MARK);
    stripe([0, 0.05, 5.1], [road, 0.05, 5.1], [186, 190, 198], 0.15, LAYER.MARK);
    for (x = 2; x < road - 3; x += 9) stripe([x, 0.05, 0], [Math.min(x + 4.5, road), 0.05, 0], [232, 196, 86], 0.16, LAYER.MARK);
    // 危险区（才开始刹车就晚了）红色带
    var dz = road - DANGER;
    quad([dz, 0.035, -5.2], [road, 0.035, -5.2], [road, 0.035, 5.2], [dz, 0.035, 5.2], [188, 60, 46], LAYER.MARK, { a: 0.34, fog: false });
    stripe([dz, 0.06, -5.2], [dz, 0.06, 5.2], [255, 138, 108], 0.3, LAYER.MARK, { noFog: true });
    label([dz, 2.6, 6.4], '才开始刹车就晚了 ' + DANGER.toFixed(0) + 'm', [255, 168, 140], 1.1);

    // ---- 距离刻度（每 20m 一道横线，每 40m 一个数字牌） ----
    for (var d = 20; d < road; d += 20) {
      var dx = road - d;
      stripe([dx, 0.05, -5.2], [dx, 0.05, 5.2], [226, 232, 240], 0.18, LAYER.MARK, { a: 0.5 });
      if (d % 40 === 0) label([dx, 1.6, 6.4], String(d), [226, 234, 245], 1.0);
    }

    // ---- 路边景物（速度感）----
    for (x = 10; x < road - 6; x += 26) {
      for (var sgn = -1; sgn <= 1; sgn += 2) {
        var pz = 6.6 * sgn;
        box(x, x + 0.28, 0, 1.5, pz - 0.14, pz + 0.14, [206, 208, 214], LAYER.PROP);
        box(x - 0.05, x + 0.33, 1.5, 1.72, pz - 0.19, pz + 0.19, [214, 76, 62], LAYER.PROP);
      }
    }
    // 崖边红白警戒挡板（立在崖口上，车身停稳时不会插进去）
    for (i = 0; i < 10; i++) {

    for (i = 0; i < 6; i++) {
      var pzz = -6.5 + i * 2.6;

    // ---- 车 ----
    buildCar(pose);

    // ---- 尘烟 ----
    for (i = 0; i < smoke.length; i++) {
      var p = smoke[i];
      puff([p.x, Math.max(0.05, p.y), p.z], p.r, [206, 210, 220], Math.max(0, p.life / p.max) * p.alpha);

      quad([st - 0.5, 0.06, -5.2], [st + 0.5, 0.06, -5.2], [st + 0.5, 0.06, 5.2], [st - 0.5, 0.06, 5.2], col, LAYER.MARK, { a: 0.5, fog: false });

  }

  /** 车子（局部坐标：车头在 x=0，地面 y=0，绕车身中心旋转） */
  function buildCar(P) {
    var cy = Math.cos(P.yaw), sy = Math.sin(P.yaw);
    var cp = Math.cos(P.pitch), sp = Math.sin(P.pitch);
    var cr = Math.cos(P.roll), sr = Math.sin(P.roll);
    function pt(v) {
      var px = v[0] + 2.3, py = v[1] - 0.85, pz = v[2];
      var x1 = px * cy + pz * sy, z1 = -px * sy + pz * cy;
      var x2 = x1 * cp - py * sp, y2 = x1 * sp + py * cp;
      var y3 = y2 * cr - z1 * sr, z3 = y2 * sr + z1 * cr;
      return [P.x + x2 - 2.3, P.y + y3 + 0.85, P.z + z3];
    }
    function bx(x0, x1, y0, y1, z0, z1, col, layer, opt) {
      poly([pt([x1, y0, z1]), pt([x1, y0, z0]), pt([x1, y1, z0]), pt([x1, y1, z1])], col, layer, opt);
      poly([pt([x0, y0, z0]), pt([x0, y0, z1]), pt([x0, y1, z1]), pt([x0, y1, z0])], col, layer, opt);
      poly([pt([x0, y1, z1]), pt([x1, y1, z1]), pt([x1, y1, z0]), pt([x0, y1, z0])], col, layer, opt);
      poly([pt([x0, y0, z0]), pt([x1, y0, z0]), pt([x1, y0, z1]), pt([x0, y0, z1])], col, layer, opt);
      poly([pt([x0, y0, z1]), pt([x1, y0, z1]), pt([x1, y1, z1]), pt([x0, y1, z1])], col, layer, opt);
      poly([pt([x0, y0, z0]), pt([x0, y1, z0]), pt([x1, y1, z0]), pt([x1, y0, z0])], col, layer, opt);
    }
    var braking = g.brakeOn || g.pedalBroken;
    var body = braking ? [206, 66, 46] : [52, 132, 214];
    var dark = braking ? [150, 40, 28] : [32, 92, 160];

    // 地面影子
    if (P.y < 0.1) {
      poly([pt([-5.0, 0.03, -1.05]), pt([0.4, 0.03, -1.05]), pt([0.4, 0.03, 1.05]), pt([-5.0, 0.03, 1.05])],
        [10, 12, 18], LAYER.MARK, { a: 0.42, fog: false });
    }
    // 底盘 + 车身
    bx(-4.55, -0.05, 0.34, 1.02, -0.94, 0.94, body, LAYER.CAR);
    bx(-4.3, -1.35, 1.02, 1.08, -0.9, 0.9, dark, LAYER.CAR);          // 腰线
    // 座舱（前挡风倾斜）
    var cab = [[-4.05, 1.02, -0.82], [-1.15, 1.02, -0.82], [-1.62, 1.66, -0.72], [-3.66, 1.66, -0.72]];
    var cabR = [[-4.05, 1.02, 0.82], [-1.15, 1.02, 0.82], [-1.62, 1.66, 0.72], [-3.66, 1.66, 0.72]];
    poly([pt(cab[0]), pt(cab[3]), pt(cab[2]), pt(cab[1])], [26, 30, 40], LAYER.CAR);            // 左侧窗
    poly([pt(cabR[1]), pt(cabR[2]), pt(cabR[3]), pt(cabR[0])], [26, 30, 40], LAYER.CAR);         // 右侧窗
    poly([pt([-1.15, 1.02, -0.82]), pt([-1.62, 1.66, -0.72]), pt([-1.62, 1.66, 0.72]), pt([-1.15, 1.02, 0.82])], [58, 74, 96], LAYER.CAR);  // 前挡风
    poly([pt([-4.05, 1.02, 0.82]), pt([-3.66, 1.66, 0.72]), pt([-3.66, 1.66, -0.72]), pt([-4.05, 1.02, -0.82])], [46, 60, 80], LAYER.CAR);  // 后窗
    poly([pt([-3.66, 1.66, -0.72]), pt([-1.62, 1.66, -0.72]), pt([-1.62, 1.66, 0.72]), pt([-3.66, 1.66, 0.72])], body, LAYER.CAR);           // 车顶
    // 车轮（前后 × 左右）
    var wx = [-0.98, -3.62], wz = [-0.86, 0.86];
    for (var a = 0; a < 2; a++) {
      for (var b = 0; b < 2; b++) {
        var z0 = wz[b], z1 = wz[b] + (b ? 0.22 : -0.22);
        bx(wx[a] - 0.36, wx[a] + 0.36, 0, 0.7, Math.min(z0, z1), Math.max(z0, z1), [30, 33, 39], LAYER.CAR);
        poly([pt([wx[a] - 0.22, 0.12, z1]), pt([wx[a] + 0.22, 0.12, z1]), pt([wx[a] + 0.22, 0.58, z1]), pt([wx[a] - 0.22, 0.58, z1])],
          [150, 158, 170], LAYER.CAR);   // 轮毂

    }
    // 车灯
    poly([pt([-0.08, 0.62, -0.78]), pt([-0.08, 0.62, -0.44]), pt([-0.08, 0.86, -0.44]), pt([-0.08, 0.86, -0.78])], [255, 238, 180], LAYER.CAR, { fog: false });
    poly([pt([-0.08, 0.62, 0.44]), pt([-0.08, 0.62, 0.78]), pt([-0.08, 0.86, 0.78]), pt([-0.08, 0.86, 0.44])], [255, 238, 180], LAYER.CAR, { fog: false });
    var tail = braking ? [255, 60, 44] : [150, 40, 36];
    poly([pt([-4.57, 0.62, -0.86]), pt([-4.57, 0.62, -0.5]), pt([-4.57, 0.9, -0.5]), pt([-4.57, 0.9, -0.86])], tail, LAYER.CAR, { fog: false });
    poly([pt([-4.57, 0.62, 0.5]), pt([-4.57, 0.62, 0.86]), pt([-4.57, 0.9, 0.86]), pt([-4.57, 0.9, 0.5])], tail, LAYER.CAR, { fog: false });
  }

  // ================================================================ 渲染
  function clipNear(cs) {
    var out = [], n = cs.length;
    for (var i = 0; i < n; i++) {
      var a = cs[i], b = cs[(i + 1) % n];
      var ain = a[2] >= NEAR, bin = b[2] >= NEAR;
      if (ain) out.push(a);
      if (ain !== bin) {
        var t = (NEAR - a[2]) / (b[2] - a[2]);
        out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, NEAR]);
      }
    }
    return out;
  }
  function fogOf(d) {
    var t = (d - FOG_A) / (FOG_B - FOG_A);
    return t < 0 ? 0 : (t > 1 ? 1 : t);
  }

  function drawSky() {
    var gr = ctx.createLinearGradient(0, 0, 0, H * 0.78);
    gr.addColorStop(0, '#0a1526');
    gr.addColorStop(0.42, '#20365a');
    gr.addColorStop(0.7, '#4a5878');
    gr.addColorStop(1, '#c98455');
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, W, H);
    // 太阳（无限远：只用方向投影）
    var sd = norm([0.62, 0.2, 0.42]);
    var c = [dot(sd, camRight), dot(sd, camUp), dot(sd, camFwd)];
    if (c[2] > 0.02) {
      var pxx = sx2(c), pyy = sy2(c), R = Math.max(26, H * 0.05);
      var gl = ctx.createRadialGradient(pxx, pyy, 2, pxx, pyy, R * 6);
      gl.addColorStop(0, 'rgba(255,214,150,.75)');
      gl.addColorStop(0.3, 'rgba(255,160,100,.22)');
      gl.addColorStop(1, 'rgba(255,120,60,0)');
      ctx.fillStyle = gl;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,238,206,.96)';
      ctx.beginPath(); ctx.arc(pxx, pyy, R, 0, 6.2832); ctx.fill();
    }
  }

  function draw3d() {
    // 变换 + 裁剪 + 投影
    var list = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.t === 0) {
        var cs = clipNear(it.c);
        if (cs.length < 3) continue;
        var sp = [], d = 0;
        for (var k = 0; k < cs.length; k++) { sp.push(sx2(cs[k]), sy2(cs[k])); d += cs[k][2]; }
        list.push({ it: it, sp: sp, d: d / cs.length });
      } else if (it.t === 1) {
        if (it.p[2] < NEAR) continue;
        list.push({ it: it, x: sx2(it.p), y: sy2(it.p), r: it.r * focal / it.p[2], d: it.p[2] });
      } else if (it.t === 2) {
        if (it.p[2] < NEAR) continue;
        list.push({ it: it, x: sx2(it.p), y: sy2(it.p), d: it.p[2] });
      } else {
        if (it.c[0][2] < NEAR || it.c[1][2] < NEAR) continue;
        var dd = (it.c[0][2] + it.c[1][2]) / 2;
        if (dd < 8) continue;                     // 太贴脸的长条(基本被车身挡住的)不画，免得撑满屏幕
        list.push({ it: it, x1: sx2(it.c[0]), y1: sy2(it.c[0]), x2: sx2(it.c[1]), y2: sy2(it.c[1]), d: dd });
      }
    }
    list.sort(function (a, b) { return (a.it.L - b.it.L) || (b.d - a.d); });

    ctx.save();
    ctx.translate(shakeX, shakeY);
    for (i = 0; i < list.length; i++) {
      var o = list[i], it2 = o.it;
      if (it2.t === 0) {
        var f = it2.fog ? fogOf(o.d) : 0;
        var r = it2.col[0] + (FOG[0] - it2.col[0]) * f;
        var gg = it2.col[1] + (FOG[1] - it2.col[1]) * f;
        var bb = it2.col[2] + (FOG[2] - it2.col[2]) * f;
        ctx.globalAlpha = it2.a;
        var style = 'rgb(' + (r | 0) + ',' + (gg | 0) + ',' + (bb | 0) + ')';
        ctx.fillStyle = style;
        ctx.strokeStyle = style;             // 必须每次设置：否则继承上一条线的颜色，出现亮边
        ctx.beginPath();
        ctx.moveTo(o.sp[0], o.sp[1]);
        for (k = 2; k < o.sp.length; k += 2) ctx.lineTo(o.sp[k], o.sp[k + 1]);
        ctx.closePath();
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.stroke();                        // 补缝，避免多边形之间出现发丝缝
      } else if (it2.t === 1) {
        var f2 = fogOf(o.d);
        ctx.globalAlpha = it2.a;
        var rr2 = Math.max(0.6, o.r);
        ctx.drawImage(SMOKE_SPR, o.x - rr2, o.y - rr2, rr2 * 2, rr2 * 2);
      } else if (it2.t === 2) {
        ctx.globalAlpha = 1;
        var sz = Math.max(9, Math.min(22, focal * 0.032 / o.d * it2.size * 8));
        ctx.font = '700 ' + sz.toFixed(0) + 'px "Segoe UI",system-ui';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(6,10,18,.55)';
        var wpx = ctx.measureText(it2.s).width;
        ctx.fillRect(o.x - wpx / 2 - 5, o.y - sz * 0.85, wpx + 10, sz * 1.15);
        ctx.fillStyle = 'rgb(' + it2.col[0] + ',' + it2.col[1] + ',' + it2.col[2] + ')';
        ctx.fillText(it2.s, o.x, o.y);
      } else {
        ctx.globalAlpha = it2.a;
        ctx.strokeStyle = 'rgb(' + it2.col[0] + ',' + it2.col[1] + ',' + it2.col[2] + ')';
        ctx.lineWidth = Math.max(1, Math.min(20, it2.w * focal / o.d));
        ctx.beginPath(); ctx.moveTo(o.x1, o.y1); ctx.lineTo(o.x2, o.y2); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function draw() {
    if (g.shake > 0) {
      var m = g.shake * 7;
      shakeX = (Math.random() - 0.5) * m; shakeY = (Math.random() - 0.5) * m;
    } else { shakeX = 0; shakeY = 0; }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    drawSky();
    buildWorld();
    draw3d();
    // 撞地白闪
    if (flash > 0) {
      ctx.fillStyle = 'rgba(255,246,232,' + (flash * 0.26).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    // 暗角
    var vg = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.42, W / 2, H * 0.55, Math.max(W, H) * 0.78);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }

  // ================================================================ 相机
  function updateCamera(dt) {
    var turning = (g.phase === 'wreck' || g.phase === 'falling');
    var want = [g.x - 8.6, 3.4, 3.9];
    var look = [g.x + 9.5, 1.0, 0];
    if (turning) {
      want = [g.x - 8.0, 3.4 + g.yOff * 0.35, 4.6];
      look = [g.x + 3.5, 1.2 + g.yOff * 0.55, 0];
    }
    var k = Math.min(1, (dt || 0.016) * (turning ? 3.2 : 7));
    for (var i = 0; i < 3; i++) {
      camWant[i] += (want[i] - camWant[i]) * k;
      camLook[i] += (look[i] - camLook[i]) * k;
    }
    lookAt([camWant[0], camWant[1], camWant[2]], [camLook[0], camLook[1], camLook[2]]);
  }
  function resize() {
    var r = stage.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(320, Math.round(r.width));
    H = Math.max(180, Math.round(r.height));
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    focal = (H * 0.5) / Math.tan(29 * Math.PI / 180);   // 竖直 FOV 58°
  }

  // ================================================================ 粒子 / 音效
  var smoke = [], skid = [], flash = 0, prevPhase = 'idle', snapFired = false;
  function spawnP(x, y, z, o) {
    if (smoke.length > 300) smoke.shift();
    smoke.push({
      x: x, y: y, z: z, vx: o.vx || 0, vy: o.vy || 0, vz: o.vz || 0,
      r: o.r || 0.2, grow: o.grow == null ? 0.5 : o.grow,
      life: o.life || 0.8, max: o.life || 0.8,
      col: o.col || [206, 214, 226], alpha: o.alpha == null ? 0.42 : o.alpha
    });
  }
  function updateSmoke(dt) {
    for (var i = smoke.length - 1; i >= 0; i--) {
      var p = smoke[i];
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.r += p.grow * dt;
      if (p.r < 0.03) p.r = 0.03;
      if (p.life <= 0) smoke.splice(i, 1);
    }
  }

  var Sound = (function () {
    var ac = null, noiseBuf = null, skidGain = null, ready = false, on = true;
    function init() {
      if (ready) return;
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ac = new AC();
        var len = Math.floor(ac.sampleRate * 1.2);
        noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
        var d = noiseBuf.getChannelData(0);
        for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        var src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
        var bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 1.1;
        skidGain = ac.createGain(); skidGain.gain.value = 0;
        src.connect(bp); bp.connect(skidGain); skidGain.connect(ac.destination);
        src.start(); ready = true;
      } catch (e) { ready = false; }
    }
    function resume() { try { if (ac && ac.state === 'suspended') ac.resume(); } catch (e) {} }
    function skid(l) { if (!ready || !on) return; try { skidGain.gain.setTargetAtTime(Math.max(0, l) * 0.15, ac.currentTime, 0.06); } catch (e) {} }
    function noise(dur, vol, freq, to) {
      if (!ready || !on) return;
      try {
        var s = ac.createBufferSource(); s.buffer = noiseBuf;
        var f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq;
        if (to) { f.frequency.setValueAtTime(freq, ac.currentTime); f.frequency.exponentialRampToValueAtTime(Math.max(60, to), ac.currentTime + dur); }
        var gn = ac.createGain();
        gn.gain.setValueAtTime(vol, ac.currentTime);
        gn.gain.exponentialRampToValueAtTime(0.0008, ac.currentTime + dur);
        s.connect(f); f.connect(gn); gn.connect(ac.destination);
        s.start(); s.stop(ac.currentTime + dur + 0.03);
      } catch (e) {}
    }
    function tone(freq, dur, vol, type) {
      if (!ready || !on) return;
      try {
        var o = ac.createOscillator(); o.type = type || 'sine'; o.frequency.value = freq;
        var gn = ac.createGain();
        gn.gain.setValueAtTime(0.0001, ac.currentTime);
        gn.gain.exponentialRampToValueAtTime(vol, ac.currentTime + 0.02);
        gn.gain.exponentialRampToValueAtTime(0.0008, ac.currentTime + dur);
        o.connect(gn); gn.connect(ac.destination);

    }

      init: init, resume: resume, skid: skid,
      snap: function () { noise(0.16, 0.5, 2600, 160); tone(180, 0.14, 0.22, 'square'); },
      crash: function () { noise(0.85, 0.55, 380, 70); tone(70, 0.7, 0.25, 'sawtooth'); },
      impact: function () { noise(0.6, 0.8, 900, 80); tone(56, 0.6, 0.38, 'sawtooth'); },
      win: function () { tone(660, 0.16, 0.2); setTimeout(function () { tone(880, 0.22, 0.2); }, 130); setTimeout(function () { tone(1180, 0.3, 0.16); }, 270); },
      toggle: function () { on = !on; if (!on) skid(0); return on; }
    };
  })();

  // ================================================================ 主循环
  function step(dt) {
    var wasPhase = g.phase;
    g.tick(dt);
    if (g.phase === 'run' && g.brakeOn && g.v > 3) {
      if (Math.random() < 0.5) spawnP(g.x - 1.2 - Math.random() * 3.4, 0.05 + Math.random() * 0.3, (Math.random() - 0.5) * 1.8,
        { vx: -1.2 - Math.random() * 1.6, vy: 0.5, r: 0.16 + Math.random() * 0.2, life: 0.7 + Math.random() * 0.5, grow: 0.5 });
      if (!skid.length || g.x - skid[skid.length - 1] > 1.6) { skid.push(g.x - 1.0); if (skid.length > 420) skid.shift(); }
    }
    if (g.phase === 'wreck' && !g.airborne) {
      for (var s = 0; s < 2; s++) {
        spawnP(g.x - 1.5 - Math.random() * 3.2, 0.05 + Math.random() * 0.4, (Math.random() - 0.5) * 2.2,
          { vx: -3 - Math.random() * 4, vy: 1 + Math.random() * 2, r: 0.22 + Math.random() * 0.28, life: 0.6 + Math.random() * 0.5, grow: 1.0, col: [190, 186, 180], alpha: 0.5 });
      }
      if (Math.random() < 0.6) {
        spawnP(g.x - 2 - Math.random() * 2, 0.1 + Math.random() * 0.3, (Math.random() - 0.5) * 2,
          { vx: -5 - Math.random() * 6, vy: 2 + Math.random() * 3, r: 0.055, life: 0.25 + Math.random() * 0.2, grow: -0.05, col: [255, 196, 90], alpha: 0.95 });
      }
    }
    if (g.phase === 'wreck' && g.airborne) {
      if (Math.random() < 0.8) {
        spawnP(g.x - 1.6 - Math.random() * 3, g.yOff + 0.15 + Math.random() * 0.7, (Math.random() - 0.5) * 2,
          { vx: -1 - Math.random() * 2, vy: 0.2, r: 0.2 + Math.random() * 0.26, life: 0.5 + Math.random() * 0.4, grow: 0.9, alpha: 0.4 });
      }
    }
    updateSmoke(dt);
    Sound.skid(g.phase === 'wreck' && !g.airborne ? 1 : (g.brakeOn && g.v > 3 ? Math.min(1, g.v / 20) : 0));
    if (flash > 0) flash = Math.max(0, flash - dt * 3.6);

    if (wasPhase !== g.phase) {
      if (g.phase === 'wreck') { Sound.snap(); Sound.crash(); }
      if (g.phase === 'falling') Sound.crash();
      if (g.phase === 'lost' && g.impact) {
        Sound.impact(); flash = 1;
        for (var k = 0; k < 34; k++) {
          var ang = Math.random() * Math.PI, sp2 = 2 + Math.random() * 7;
          spawnP(g.x - 2.3, 0.1 + Math.random() * 0.5, (Math.random() - 0.5) * 3, {
            vx: (Math.random() < 0.5 ? -1 : 1) * Math.cos(ang) * sp2, vy: Math.abs(Math.sin(ang)) * sp2 * 0.7,
            r: 0.25 + Math.random() * 0.5, life: 0.7 + Math.random() * 0.8, grow: 1.4, col: [176, 166, 150], alpha: 0.55
          });
        }
      }
      if (g.isTerminal()) finish();
      prevPhase = g.phase;
    }
    if (g.pedalBroken && !snapFired) {
      snapFired = true;
      el.pedalPanel.classList.remove('flash');
      void el.pedalPanel.offsetWidth;
      el.pedalPanel.classList.add('flash');
    }
  }

  var lastT = 0, acc = 0, paused = true, runLoop = true;
  function loop(now) {
    if (!runLoop) return;
    requestAnimationFrame(loop);
    var dt = (now - lastT) / 1000;
    lastT = now;
    if (!(dt > 0) || dt > 0.3) dt = 0.016;
    if (!paused) {
      acc += dt;
      var n = 0;
      while (acc >= 1 / 120 && n < 48) { step(1 / 120); acc -= 1 / 120; n++; }
      if (n >= 48) acc = 0;
    } else {
      updateSmoke(dt * 0.6);
    }
    updateCamera(dt);
    updateUI();
    draw();
  }

  // ================================================================ UI（与归档的 2D 版一致）
  var TICKS_DONE = false;
  function buildGauges() {
    if (TICKS_DONE) return;
    TICKS_DONE = true;
    var vals = [0, 400, 800, 1200, 1612], html = '';
    for (var i = 0; i < vals.length; i++) html += '<i style="bottom:' + (vals[i] / 1612 * 100).toFixed(1) + '%">' + vals[i] + '</i>';
    el.gaugeTicks.innerHTML = html;
    var max = 160, a0 = 180, a1 = 360, CX = 103, CY = 92, t = '';
    for (var v = 0; v <= max; v += 20) {
      var a = (a0 + (v / max) * (a1 - a0)) * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
      t += '<line x1="' + (CX + ca * 64).toFixed(1) + '" y1="' + (CY + sa * 64).toFixed(1) + '" x2="' + (CX + ca * 74).toFixed(1) +
        '" y2="' + (CY + sa * 74).toFixed(1) + '" stroke="rgba(255,255,255,' + (v % 40 === 0 ? '.42' : '.18') + ')" stroke-width="' + (v % 40 === 0 ? 2 : 1) + '"/>';
      if (v % 40 === 0) t += '<text x="' + (CX + ca * 87).toFixed(1) + '" y="' + (CY + sa * 87 + 4).toFixed(1) + '" fill="rgba(255,255,255,.45)" font-size="11" font-weight="600" text-anchor="middle">' + v + '</text>';
    }
    el.speedTicks.innerHTML = t;
    function arc(r, a0d, a1d) {
      var s = a0d * Math.PI / 180, e = a1d * Math.PI / 180;
      return 'M' + (CX + Math.cos(s) * r).toFixed(1) + ' ' + (CY + Math.sin(s) * r).toFixed(1) +
        ' A' + r + ' ' + r + ' 0 0 1 ' + (CX + Math.cos(e) * r).toFixed(1) + ' ' + (CY + Math.sin(e) * r).toFixed(1);
    }
    el.speedArc.setAttribute('d', arc(72, 180, 360));
    el.speedArcFill.setAttribute('d', arc(72, 180, 360));
    el.speedArcFill.style.strokeDasharray = '227';
    el.speedArcFill.style.strokeDashoffset = '227';
    el.theoDist.textContent = THEO.brakeDist.toFixed(0) + ' m';
    el.trackDanger.style.width = ((DANGER / g.roadLen) * 100).toFixed(1) + '%';
  }

  function phaseClass() {
    if (g.phase === 'run' && g.brakeOn) return 'brake';
    if (g.phase === 'accel' || g.phase === 'idle') return 'calm';
    if (g.phase === 'run') return 'go';
    if (g.phase === 'wreck' || g.phase === 'falling' || g.phase === 'lost') return 'bad';
    return 'go';
  }
  function predictNeed() { return (g.v * g.v) / (2 * g.cfg.brakeDecel) * FEATHER; }

  function updateUI() {
    var kmh = g.kmh();
    el.speedText.textContent = Math.round(kmh);
    el.needle.setAttribute('transform', 'translate(103,92) rotate(' + (180 + Math.min(kmh, 160) / 160 * 180).toFixed(1) + ')');
    el.speedArcFill.style.strokeDashoffset = (227 * (1 - Math.min(kmh, 160) / 160)).toFixed(1);
    el.pedalFill.style.height = (g.pedalPct() * 100).toFixed(1) + '%';
    el.pedalVal.innerHTML = Math.round(g.F) + '<small>N</small>';
    el.pedalSub.innerHTML = '上限 1612 N<br>还能撑 ' + g.holdLeft().toFixed(2) + ' s';
    el.pedalPanel.classList.toggle('broken', g.pedalBroken);
    el.pedalPanel.classList.toggle('danger', !g.pedalBroken && g.pedalPct() > 0.9);
    el.heldText.textContent = g.heldT.toFixed(2) + ' s';
    el.leftText.textContent = g.holdLeft().toFixed(2) + ' s';
    el.distText.textContent = g.distToCliff().toFixed(1) + ' m';
    var frac = Math.min(1, Math.max(0, g.x / g.roadLen));
    el.trackFill.style.width = (frac * 100).toFixed(2) + '%';
    el.trackCar.style.left = (frac * 100).toFixed(2) + '%';

    var s = '';
    switch (g.phase) {
      case 'idle': s = '准备就绪 · 点开始'; break;
      case 'accel': s = '加速中 ' + Math.round(kmh) + ' km/h → 待 100'; break;
      case 'run': s = g.brakeOn ? ('刹车中 ' + Math.round(kmh) + ' km/h · 力度 ' + Math.round(g.F) + 'N') : '已到 100 km/h · 该点刹了!'; break;
      case 'wreck': s = g.airborne ? '失控飞出 · 空中翻滚!' : '踏板断裂 · 车辆失控甩尾!'; break;
      case 'falling': s = '冲过崖边 · 坠落中…'; break;
      case 'won': s = '成功刹停'; break;
      case 'lost': s = g.impact ? '撞毁 · 挑战失败' : '坠入悬崖'; break;
    }
    if (g.pedalBroken && g.phase === 'run') s = '踏板断裂! 刹车失效';
    el.status.textContent = s;
    el.status.className = 'pill ' + phaseClass();

    var locked = !(g.phase === 'run' && !g.pedalBroken);
    el.brakeBtn.disabled = locked;
    el.brakeBtn.classList.toggle('locked', locked);
    el.brakeBtn.classList.toggle('on', g.brakeOn);
    var bt = el.brakeBtn.firstChild;
    var label = g.pedalBroken ? '踏板已断裂' :
      (g.phase === 'accel' || g.phase === 'idle') ? '刹车锁定中' :
      (g.phase === 'wreck') ? '车辆失控中' :
      (g.phase === 'falling') ? '坠落中…' :
      (g.phase === 'lost' || g.phase === 'won') ? '本局结束' :
      g.brakeOn ? '刹车中…' : '按住刹车';
    if (bt && bt.nodeType === 3 && bt.nodeValue !== label) bt.nodeValue = label;

    var need = predictNeed();
    el.needText.textContent = '≈ ' + need.toFixed(0) + ' m';
    if (g.phase === 'idle') el.predictText.innerHTML = '— 开始后自动加速到 100 km/h —';
    else if (g.phase === 'accel') el.predictText.innerHTML = '— 到 100 km/h 才能踩刹车 —';
    else if (g.phase === 'run') {
      var margin = g.roadLen - g.x - need;
      if (g.pedalBroken) el.predictText.innerHTML = '<span class="warn">踏板已断裂 · 刹车失效</span>';
      else if (g.brakeOn && g.pedalPct() > 0.93) el.predictText.innerHTML = '<span class="warn">力度 ' + Math.round(g.F) + ' N —— 快断了，松一下!</span>';
      else if (g.brakeOn) el.predictText.innerHTML = '刹车中 · 力度 <b>' + Math.round(g.F) + ' N</b> · 还能连踩 <b>' + g.holdLeft().toFixed(2) + ' s</b>';
      else if (margin >= 0) el.predictText.innerHTML = '<span class="ok">还不算晚</span> · 现在点刹会停在崖前 ' + margin.toFixed(0) + ' m';
      else el.predictText.innerHTML = '<span class="warn">太晚了</span> · 现在踩要超出 ' + (-margin).toFixed(0) + ' m';
    } else if (g.phase === 'won') el.predictText.innerHTML = '<span class="ok">车头距崖边 ' + g.stopMargin.toFixed(1) + ' m</span>';
    else if (g.phase === 'wreck') el.predictText.innerHTML = '<span class="warn">车辆失控 · 挑战失败</span>';
    else if (g.phase === 'falling') el.predictText.innerHTML = '<span class="warn">坠落中 · 挑战失败</span>';
    else el.predictText.innerHTML = '<span class="warn">没能停下</span>';
  }

  // ================================================================ 流程
  var best = null;
  try { best = JSON.parse(localStorage.getItem('cliffBrakeBest') || 'null'); } catch (e) { best = null; }

  function openOverlay(html) { el.ovPanel.innerHTML = html; el.overlay.classList.remove('hide'); paused = true; }
  function closeOverlay() { el.overlay.classList.add('hide'); paused = false; }

  function showStart() {
    openOverlay(
      '<h1>悬崖急刹 <span style="font-size:14px;color:#8fa2ba">3D</span></h1>' +
      '<p class="lead">第三人称车后视角。把 100 km/h 的车刹停在崖边 —— 停得越贴边，分越高。</p>' +
      '<ul>' +
      '<li>起步自动加速到 <b>100 km/h</b>，到速后才能踩刹车</li>' +
      '<li>刹车很猛(9.2 m/s²)，从 100 刹停总共只需踩住 <b>3.02 秒</b></li>' +
      '<li>但踏板力度表随踩住时间涨：<b>一脚不松 2.86 秒就顶到 1612 N 断裂</b>，车立刻失控飞出</li>' +
      '<li>所以只能<b>点刹</b>：踩住半秒多、松一下让力度回落，反复点，踩够 3.02 秒才停得住</li>' +
      '<li>松手时车不减速：点刹要多滑 15~20 米，<b>得比"一脚踩死"提前开始</b></li>' +
      '<li>目标：停在离崖边 <b>3 米内</b>（满分 100）</li>' +
      '</ul>' +
      '<div class="row"><button class="btn" id="startBtn2">开始游戏</button></div>' +
      '<p class="lead" style="margin:12px 0 0">按住 <span class="kbd">空格</span> 或按住下方红色按钮点刹</p>'
    );
    var b = $('#startBtn2'); if (b) b.onclick = startRound;
  }

  function showResult(win) {
    var margin = g.stopMargin, rk = g.rating, reason = '';
    if (!win) {
      if (g.pedalBroken) reason = '刹车踏板在踩下 ' + g.brokeAtT.toFixed(2) + ' s 累积到 1612 N 后断裂，车速 ' +
        Math.round(g.brokeAtV * 3.6) + ' km/h 时彻底失去制动，车辆随即失控' + (g.impact ? '翻车撞毁。' : '，飞出路面坠入悬崖。');
      else if (g.heldT < 0.05) reason = '全程没有踩刹车，车直接冲出了崖边。';
      else reason = '刹车点太晚：车头越过崖边时还剩 ' + Math.round(g.v * 3.6) + ' km/h，距离不够。';
    }
    openOverlay(
      (win ? '<h2>刹住了！</h2>' : '<h2>坠入悬崖</h2>') +
      (win ?
        '<div class="res-score">' + g.score + '<span style="font-size:16px;color:#93a6bf"> 分</span></div>' +
        '<div class="res-meta"><span class="res-rank">' + rk.key + '</span> ' + rk.name + ' · ' + rk.tip + '<br>车头距崖边 <b>' + margin.toFixed(1) +
        ' m</b>，刹停用了 <b>' + g.heldT.toFixed(2) + ' s</b>，峰值力度 <b>' + Math.round(g.F) + ' N</b></div>'
        : '<div class="res-meta" style="margin-top:12px">' + reason + '</div>') +
      '<div class="res-meta">本局：发动机加速度 ' + g.engineA.toFixed(2) + ' m/s²，崖边在 ' + g.roadLen.toFixed(0) + ' m 处' +
      (best ? ' ｜ 历史最佳 <b>' + best.score + ' 分</b>（距崖 ' + best.margin.toFixed(1) + ' m）' : '') + '</div>' +
      '<div class="row"><button class="btn" id="againBtn">再来一局</button><button class="btn ghost" id="rulesBtn">看规则</button></div>'
    );
    var a = $('#againBtn'); if (a) a.onclick = startRound;
    var r = $('#rulesBtn'); if (r) r.onclick = showStart;
  }

  function startRound() {
    Sound.init(); Sound.resume();
    g.reset();
    smoke = []; skid = []; prevPhase = 'idle'; snapFired = false; flash = 0;
    camWant = [g.x - 8.6, 3.4, 3.9]; camLook = [g.x + 9.5, 1.0, 0];
    el.trackDanger.style.width = ((DANGER / g.roadLen) * 100).toFixed(1) + '%';
    closeOverlay();
    g.start();
  }

  function finish() {
    Sound.skid(0);
    if (g.phase === 'won') {
      Sound.win();
      var sc = { score: g.score, margin: g.stopMargin, at: Date.now() };
      if (!best || sc.score > best.score || (sc.score === best.score && sc.margin < best.margin)) {
        best = sc;
        try { localStorage.setItem('cliffBrakeBest', JSON.stringify(best)); } catch (e) {}
      }
    }
    setTimeout(function () { if (g.isTerminal()) showResult(g.phase === 'won'); },
      g.phase === 'won' ? 650 : (g.impact ? 700 : 450));
  }

  // ================================================================ 输入
  var holding = false;
  function press(on) {
    holding = on; g.setBrake(on);
    if (on) { Sound.init(); Sound.resume(); }
  }
  el.brakeBtn.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (el.brakeBtn.disabled) return;
    try { el.brakeBtn.setPointerCapture(e.pointerId); } catch (err) {}
    press(true);
  });
  window.addEventListener('pointerup', function () { if (holding) press(false); });
  window.addEventListener('pointercancel', function () { if (holding) press(false); });
  window.addEventListener('blur', function () { if (holding) press(false); });
  el.brakeBtn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowDown') {
      e.preventDefault();
      if (g.phase === 'idle' && !el.overlay.classList.contains('hide')) { startRound(); return; }
      if (!el.brakeBtn.disabled && !holding) press(true);
    } else if (e.code === 'Enter') { if (g.phase === 'idle' || g.isTerminal()) startRound(); }
    else if (e.key === 'm' || e.key === 'M') toggleSound();
  });
  window.addEventListener('keyup', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowDown') { e.preventDefault(); if (holding) press(false); }
  });
  function toggleSound() { el.soundBtn.textContent = Sound.toggle() ? '🔊' : '🔇'; }
  el.soundBtn.addEventListener('click', toggleSound);
  window.addEventListener('resize', function () { resize(); draw(); });
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); draw(); }).observe(stage);

  // ================================================================ 自检
  function simScript(opt, brakeX, h, r, maxT) {
    g.reset(opt); g.start();
    smoke = []; skid = []; snapFired = false; flash = 0;
    camWant = [g.x - 8.6, 3.4, 3.9]; camLook = [g.x + 9.5, 1.0, 0];
    var dt = 1 / 120, n = 0, t0 = null, drawErr = null;
    while (!g.isTerminal() && n * dt < (maxT || 60)) {
      var on = false;
      if (g.phase === 'run' && g.x >= brakeX) {
        if (t0 === null) t0 = g.t;
        on = h == null ? true : ((g.t - t0) % (h + r)) < h;
      }
      g.setBrake(on);
      step(dt);
      updateCamera(dt);
      if (n % 7 === 0) {
        try { updateUI(); draw(); } catch (e) { if (!drawErr) drawErr = String(e && e.message || e); }
      }
      n++;
    }
    try { updateCamera(0.05); updateUI(); draw(); } catch (e) { if (!drawErr) drawErr = String(e && e.message || e); }
    return { drawErr: drawErr, frames: n };
  }

  /* 只跑物理，量出"从 startX 起按 h 踩 / r 松"的点刹刹车距离（崖边放很远，不会掉下去） */
  function probeFeatherDist(startX, h, r) {
    g.reset({ engineA: 5.5, roadLen: 1e6 }); g.start();
    var dt = 1 / 120, n = 0, t0 = null;
    while (!g.isTerminal() && n * dt < 40) {
      var on = false;
      if (g.phase === 'run' && g.x >= startX) {
        if (t0 === null) t0 = g.t;
        on = ((g.t - t0) % (h + r)) < h;
      }
      g.setBrake(on); g.tick(dt); n++;
    }
    return g.x - startX;
  }

  window.__selftest = function () {
    var rep = { ok: true, err: [], view: '3d', checks: {} };
    try {
      runLoop = false; paused = false;
      var probe = probeFeatherDist(120, 0.6, 0.3);
      var A = simScript({ engineA: 5.5, roadLen: 120 + probe + 1 }, 120, 0.6, 0.3);
      rep.checks.feather = { brakeDist: +probe.toFixed(1), phase: g.phase, margin: g.stopMargin, score: g.score, drawErr: A.drawErr };

      g.reset({ engineA: 5.5, roadLen: 240 }); g.start();
      var broke = null, k = 0;
      while (!g.isTerminal() && k < 120 * 60) {
        g.setBrake(g.phase === 'run' && g.x >= 120);
        step(1 / 120); updateCamera(1 / 120);
        if (g.pedalBroken && !broke) broke = { t: g.t, v: +(g.v * 3.6).toFixed(1) };
        k++;
      }
      rep.checks.fullHold = { broke: broke, phase: g.phase, afterBreak: broke ? +(g.t - broke.t).toFixed(2) : null,
        events: g.events.map(function (e) { return e.type; }).join(',') };

      var C = simScript({ engineA: 5.5, roadLen: 300 }, 1e9, null, null, 40);
      rep.checks.noBrake = { phase: g.phase, drawErr: C.drawErr };

      // 渲染：像素非空 + 天空/地面对比（3D 视角下画面理应既有天空也有地面）
      try {
        var img = ctx.getImageData(0, 0, W, H).data;
        var sky = 0, ground = 0, nonEmpty = 0, sum = 0;
        for (var y = 0; y < H; y += 4) {
          for (var x2 = 0; x2 < W; x2 += 8) {
            var i2 = (y * W + x2) * 4;
            if (img[i2 + 3] > 0) nonEmpty++;
            sum += img[i2] + img[i2 + 1] + img[i2 + 2];
            if (y < H * 0.4) sky++; else ground++;
          }
        }
        rep.checks.pixels = { nonEmpty: nonEmpty, avg: +(sum / Math.max(1, nonEmpty) / 3).toFixed(1), sky: sky, ground: ground };
      } catch (e) { rep.err.push('pixel:' + e.message); }

      // 相机确实在车的右后方
      var pc = [camPos[0] - g.x, camPos[1], camPos[2]];
      rep.checks.camera = { dx: +pc[0].toFixed(2), y: +pc[1].toFixed(2), z: +pc[2].toFixed(2) };
      if (!(pc[0] < -3 && pc[2] > 1.5 && pc[1] > 1)) { rep.ok = false; rep.err.push('相机不在车右后方: ' + JSON.stringify(pc)); }

      // 3D 图元数量（确认真的在画三维几何）
      buildWorld();
      rep.checks.geometry = { items: items.length };
      if (items.length < 120) { rep.ok = false; rep.err.push('三维图元太少: ' + items.length); }

      // 输入通路
      runLoop = false; el.overlay.style.transition = 'none';
      g.reset({ engineA: 5.5, roadLen: 300 }); closeOverlay(); g.start();
      var m = 0;
      while (g.phase === 'accel' && m < 120 * 20) { step(1 / 120); m++; }
      updateUI();
      window.dispatchEvent(new KeyboardEvent('keydown', { code: 'Space', bubbles: true }));
      rep.checks.input = { keyBrake: g.brakeInput };
      for (var q = 0; q < 120; q++) step(1 / 120);
      rep.checks.input.FAfter1s = Math.round(g.F);
      window.dispatchEvent(new KeyboardEvent('keyup', { code: 'Space', bubbles: true }));
      rep.checks.input.keyRelease = g.brakeInput === false;
      el.brakeBtn.dispatchEvent(new PointerEvent('pointerdown', { pointerId: 1, bubbles: true, cancelable: true }));
      rep.checks.input.btnPress = g.brakeInput;
      window.dispatchEvent(new PointerEvent('pointerup', { pointerId: 1, bubbles: true }));
      rep.checks.input.btnRelease = g.brakeInput === false;
      if (!rep.checks.input.keyBrake) { rep.ok = false; rep.err.push('空格未触发刹车'); }
      if (!rep.checks.input.btnPress || !rep.checks.input.btnRelease) { rep.ok = false; rep.err.push('按钮事件异常'); }

      // 结算 + 重开
      try {
        g.stopMargin = 2.5; g.score = 97; g.rating = window.carRating(97); g.heldT = 3.5;
        showResult(true); var wLen = el.ovPanel.innerHTML.length;
        showResult(false); var lLen = el.ovPanel.innerHTML.length;
        startRound();
        rep.checks.flow = { win: wLen, lose: lLen, restartPhase: g.phase };
        if (g.phase !== 'accel') { rep.ok = false; rep.err.push('重开未进 accel'); }
      } catch (e) { rep.ok = false; rep.err.push('结算/重开异常:' + e.message); }

      if (rep.checks.feather.phase !== 'won') { rep.ok = false; rep.err.push('点刹应能刹停'); }
      if (rep.checks.noBrake.phase !== 'lost') { rep.ok = false; rep.err.push('不刹车应坠崖'); }
      if (!broke) { rep.ok = false; rep.err.push('一脚不松应断裂'); }
      if (!(rep.checks.fullHold.afterBreak < 3.5)) { rep.ok = false; rep.err.push('断裂后结束太慢'); }
      if (A.drawErr || C.drawErr) { rep.ok = false; rep.err.push('渲染异常:' + (A.drawErr || C.drawErr)); }
      if (!rep.checks.pixels || rep.checks.pixels.nonEmpty < 500) { rep.ok = false; rep.err.push('画布空白'); }
    } catch (e) {
      rep.ok = false; rep.err.push('exception:' + (e && e.stack || e));
    }
    el.selftest.textContent = JSON.stringify(rep);
    document.title = (rep.ok ? 'SELFTEST3D-OK ' : 'SELFTEST3D-FAIL ') + el.selftest.textContent.slice(0, 260);
    return rep;
  };

  // ================================================================ 调试快照
  function debugShot(mode) {
    runLoop = false; paused = false;
    var dt = 1 / 120;
    function adv(n) { for (var i = 0; i < n; i++) { step(dt); updateCamera(dt); } }
    function until(cond, maxT) { var k = 0; while (!cond() && k * dt < (maxT || 60)) { step(dt); updateCamera(dt); k++; } }
    function featherRun(startX, stopCond) {
      until(function () { return g.phase === 'run' && g.x >= startX; }, 30);
      var t0 = g.t, k = 0;
      while (!stopCond() && k * dt < 30) { g.setBrake(((g.t - t0) % 0.9) < 0.6); step(dt); updateCamera(dt); k++; }
    }
    g.reset({ engineA: 5.5, roadLen: 300 });
    camWant = [g.x - 8.6, 3.4, 3.9]; camLook = [g.x + 9.5, 1.0, 0]; updateCamera(1);
    if (mode === 'start') { /* 起始界面 */ }
    else if (mode === 'accel') { g.start(); until(function () { return g.kmh() > 82; }, 20); }
    else if (mode === 'braking') { g.start(); featherRun(150, function () { return g.kmh() < 50; }); }
    else if (mode === 'win') {
      var dw = probeFeatherDist(150, 0.6, 0.3);                   // 先量点刹距离，再摆崖边
      g.reset({ engineA: 5.5, roadLen: 150 + dw + 1.2 }); g.start(); featherRun(150, function () { return g.isTerminal(); });
    }
    else if (mode === 'near') { g.reset({ engineA: 5.5, roadLen: 240 }); g.start(); until(function () { return g.x >= 192; }, 30); g.setBrake(true); }
    else if (mode === 'wreck') { g.start(); until(function () { return g.x >= 150; }, 20); g.setBrake(true); until(function () { return g.pedalBroken; }, 20); adv(26); }
    else if (mode === 'air') { g.start(); until(function () { return g.x >= 150; }, 20); g.setBrake(true); until(function () { return g.pedalBroken; }, 20); adv(100); }
    else if (mode === 'impact') {
      g.start(); until(function () { return g.x >= 150; }, 20); g.setBrake(true);
      until(function () { return g.pedalBroken; }, 20); until(function () { return g.phase === 'lost'; }, 10); adv(6);
    } else if (mode === 'fall') {
      g.reset({ engineA: 5.5, roadLen: 190 }); g.start();
      until(function () { return g.phase === 'falling'; }, 40);   // 不刹车，直接冲出崖边
      adv(34);
    }
    if (mode !== 'start') { el.overlay.style.transition = 'none'; closeOverlay(); }
    updateCamera(0.05); updateUI(); draw();
  }

  // ================================================================ 启动
  function boot() {
    resize(); buildGauges(); updateUI(); draw(); showStart();
    lastT = performance.now();
    requestAnimationFrame(loop);
    var m = /shot=([a-z]+)/.exec(location.search);
    if (m) { try { debugShot(m[1]); } catch (e) { el.selftest.textContent = 'shot error: ' + (e && e.stack || e); } }
    else if (/selftest=1/.test(location.search)) window.__selftest();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
