<!DOCTYPE html><html><head><meta charset="utf-8"><title>mc</title></head><body>
<div id="out"></div>
<script src="game.js"></script>
<script>
/* 蒙特卡洛：新参数(100km/h + roadLen 200~245)下，游戏是否"总有活路、且贴边可达" */
var L = [];
function play(roadLen, engineA, aimM, h, r) {
  var g = new CarGame(); g.reset({ engineA: engineA, roadLen: roadLen }); g.start();
  var dt = 1 / 120, n = 0, t0 = null;
  while (!g.isTerminal() && n * dt < 60) {
    var on = false;
    if (g.phase === 'run' && g.x >= g.roadLen - aimM) {
      if (t0 === null) t0 = g.t;
      on = ((g.t - t0) % (h + r)) < h;
    }
    g.setBrake(on); g.tick(dt); n++;
  }
  return { phase: g.phase, margin: g.stopMargin, score: g.score, cruiseX: g.cruiseX, broke: g.pedalBroken };
}
var N = 400, consWin = 0, aimWin = 0, scores = [], wins = [], mins = [];
var worst = null;
for (var i = 0; i < N; i++) {
  var roadLen = 200 + Math.random() * 45, engineA = 4.5 + Math.random() * 1.5;
  // A) 保守：一过速就点刹（aim 很大 => 立刻开始）
  var a = play(roadLen, engineA, 1e6, 0.6, 0.3);
  if (a.phase === 'won') consWin++;
  // B) 贴边：目标停在崖前 aim=59m 处开始点刹
  var b = play(roadLen, engineA, 59, 0.6, 0.3);
  if (b.phase === 'won') { aimWin++; scores.push(b.score); wins.push(roadLen - b.margin); }
  else if (!worst) worst = { roadLen: +roadLen.toFixed(1), engineA: +engineA.toFixed(2), phase: b.phase, broke: b.broke };
  mins.push(roadLen - 59 - b.cruiseX);   // 到速后还剩多少米可以决定
}
function avg(x) { return x.reduce(function (s, v) { return s + v; }, 0) / Math.max(1, x.length); }
scores.sort(function (p, q) { return p - q; });
var rank = { S: 0, A: 0, B: 0, C: 0, D: 0 };
scores.forEach(function (s) { rank[carRating(s).key]++; });
var secMin = Math.min.apply(null, mins) / (100 / 3.6), secMax = Math.max.apply(null, mins) / (100 / 3.6);
L.push('随机 ' + N + ' 局 (roadLen 200~245, engine 4.5~6.0, 巡航 100km/h)');
L.push('  A) 一过速就点刹(保守)     : 成功 ' + consWin + '/' + N);
L.push('  B) 贴边点刹(崖前 59m 起)  : 成功 ' + aimWin + '/' + N +
  '  平均分 ' + avg(scores).toFixed(1) + '  最低 ' + scores[0] + '  最高 ' + scores[scores.length - 1]);
L.push('  评分分布 S/A/B/C/D        : ' + rank.S + '/' + rank.A + '/' + rank.B + '/' + rank.C + '/' + rank.D);
L.push('  到速后可用于决策的路程     : ' + secMin.toFixed(2) + ' ~ ' + secMax.toFixed(2) + ' s');
L.push('  贴边失败样卷(若有)         : ' + JSON.stringify(worst));
document.getElementById('out').textContent = L.join('\n');
</script></body></html>
